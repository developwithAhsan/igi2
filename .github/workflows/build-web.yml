name: Validate Cloudflare Worker website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website and pinned engine
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the pinned Wrangler CLI
        run: npm install --no-audit --no-fund

      - name: Build the .NET WebAssembly website
        run: npm run build:worker

      - name: Validate the Cloudflare Worker static-assets deployment
        run: npx wrangler deploy --dry-run

      - name: Upload website build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: igi2-worker-website
          path: publish/
          if-no-files-found: error
          retention-days: 14
