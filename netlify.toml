[build]
  command = "npm run build:worker"
  publish = "publish"

[build.environment]
  NODE_VERSION = "22"
  DOTNET_INSTALL_DIR = "/opt/buildhome/.dotnet"
  DOTNET_CLI_TELEMETRY_OPTOUT = "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE = "1"
  DOTNET_NOLOGO = "1"

# Preserve the generated game runtime and website assets as static files.
